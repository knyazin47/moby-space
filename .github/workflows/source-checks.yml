name: Source contract and security regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: moby-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Check source layout, build config and assets
        run: |
          python3 tools/test_build_config.py
          python3 tools/test_repository.py
          python3 tools/assets/test_asset_support.py
          python3 tools/check_repository.py --public
      - name: Resolve locked Dart dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile
      - name: Regenerate pinned contracts without drift
        env:
          MOBY_DART_BIN: dart
        run: |
          python3 tools/proto/install_compiler.py
          tools/proto/generate_go.sh
          tools/proto/generate_dart.sh
          git diff --exit-code -- backend/gen frontend/lib/data/server/generated
      - name: Backend analysis and race regressions
        working-directory: backend
        run: |
          go vet ./...
          go test -race ./...
      - name: Known Go vulnerability check
        working-directory: backend
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Flutter analysis and regressions
        working-directory: frontend
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter test test/server test/design/space_preview_test.dart test/design/children_tab_preview_test.dart --dart-define=MOBY_API_URL=https://api.example.invalid
      - name: Real Go and Dart transport interoperability
        env:
          MOBY_GO_BIN: go
          MOBY_DART_BIN: dart
        run: tools/integration/run_grpc_smoke.sh
